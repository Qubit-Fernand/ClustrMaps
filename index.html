<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitor Map</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: 0;
    }

    .visitor-map-frame {
      width: min(760px, 100vw, calc(100vh * 2.04));
      line-height: 0;
      overflow: hidden;
    }

    .visitor-map-frame #mapmyvisitors-widget {
      max-width: 100%;
    }

    .visitor-map-frame .mapmyvisitors-date {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="visitor-map-frame" aria-label="Visitor map for fernand.tech">
    <script
      type="text/javascript"
      id="mapmyvisitors"
      src="https://mapmyvisitors.com/map.js?d=jphtf95t_gxsh22CxBQ_2xtA8csQOD-jp3rF5A27jqE&cl=1565c0&w=a&t=tt&cmo=9db7d6&cmn=ff6b4a&ct=111827&co=ffffff"
    ></script>
  </main>
</body>
</html>
